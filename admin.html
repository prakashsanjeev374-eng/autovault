body{padding-bottom:30px}.ownerhead{padding:25px;margin-bottom:25px;color:white;background:linear-gradient(125deg,#00215d,#073cb5,#5733d7)}.ownerhead h1{font-size:28px;margin:0 0 8px}.ownerhead a{color:white}.ownerworkspace{max-width:900px;margin:0 auto;background:white;border:1px solid #dfebf8;border-radius:24px;padding:26px;min-height:350px}@media(max-width:600px){.ownerworkspace{margin:15px;padding:20px}.adminfields{grid-template-columns:1fr}.cartrow{flex-wrap:wrap}} </style></head><body><header class="ownerhead"><div class="shell"><h1>AutoVault Owner</h1><p>Private inventory management</p><a href="index.html">Open customer website</a></div></header><main class="ownerworkspace"><h2 id="modaltitle">Owner sign in</h2><div id="modalbody"></div></main><div id="toast" class="toast" role="status"></div><script>const CONFIG={"url": "https://jhguergeqjaqcardwink.supabase.co", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZ3VlcmdlcWphcWNhcmR3aW5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNDQ4NDUsImV4cCI6MjEwNjkyMDg0NX0.n-YMWnKnPKI3D7dNeCGJTuIejLbmFCzigpA18Hn4QQU", "adminEmail": "prakashsanjeev374@gmail.com"};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[['Engine','Engine Parts'],['Brakes','Brake Parts'],['Electrical','Electrical Parts'],['Body','Body Parts'],['Wheels','Tyres & Wheels'],['Suspension','Suspension']];
async function api(path,method='GET',body,token){let r=await fetch(CONFIG.url+path,{method,headers:{apikey:CONFIG.key,Authorization:'Bearer '+(token||CONFIG.key),'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):undefined});let text=await r.text(),data;try{data=JSON.parse(text)}catch{data=text}if(r.status===401&&token&&session?.refresh_token&&!path.startsWith('/auth/')){session=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});sessionStorage.setItem('av-session',JSON.stringify(session));return api(path,method,body,session.access_token)}if(!r.ok)throw Error(data.message||data.msg||data.error_description||'Request failed ('+r.status+')');return data}
function openAdmin(){if(!CONFIG.url){openInfo('Inventory admin','Backend setup is in progress. Customer preview is working; secure shared inventory editing will become available after the backend is configured.');return}if(session){adminPanel();return}modal('Owner sign in','<p class="note">Secure backend login. Only the authorized owner can change inventory. Customer accounts and payments are not enabled yet.</p><form id="loginform"><label class="note">Email<input class="authfield" id="email" type="email" required autocomplete="username"></label><br><br><label class="note">Password<input class="authfield" id="password" type="password" required autocomplete="current-password"></label><br><br><button class="primary wide">Sign in</button><p class="note" id="authstatus"></p></form>');$('loginform').onsubmit=async e=>{e.preventDefault();$('authstatus').textContent='Signing in...';try{session=await api('/auth/v1/token?grant_type=password','POST',{email:$('email').value,password:$('password').value});if(session.user.id!=='6e4b80da-b988-4644-b3b1-0cd145d6b70d')throw Error('This account is not an inventory administrator.');sessionStorage.setItem('av-session',JSON.stringify(session));adminPanel()}catch(e){$('authstatus').textContent=e.message}}}
function adminPanel(){modal('Manage inventory','<p class="note">Changes are saved to the shared backend, not just this browser. Only your authorized account can write.</p><button class="primary" id="newpart">+ Add new part</button><button class="textbtn" id="logout">Sign out</button><div id="adminlist"></div>');$('logout').onclick=()=>{session=null;sessionStorage.removeItem('av-session');openAdmin();toast('Signed out')};$('newpart').onclick=()=>editPart();let live=products.filter(p=>!p.id.startsWith('demo'));$('adminlist').innerHTML=live.length?live.map(p=>'<div class="cartrow"><div style="flex:1"><h3>'+esc(p.name)+'</h3><span class="note">'+esc(p.brand)+' '+esc(p.model)+' · '+money(p.price)+' · Stock '+p.stock+'</span></div><button class="textbtn" data-edit="'+p.id+'">Edit</button><button class="textbtn" data-delete="'+p.id+'">Delete</button></div>').join(''):'<p class="empty">No real parts yet. Add your first listing.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPart(products.find(p=>p.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let p=products.find(p=>p.id===b.dataset.delete);modal('Delete listing?','<p class="note">Remove '+esc(p.name)+' from the shared catalog? This cannot be undone here.</p><button class="primary" id="confirmdelete">Delete listing</button><button class="textbtn" id="canceldelete">Cancel</button>');$('canceldelete').onclick=adminPanel;$('confirmdelete').onclick=async()=>{try{await api('/rest/v1/parts?id=eq.'+encodeURIComponent(p.id),'DELETE',null,session.access_token);await loadStock();adminPanel();toast('Listing deleted')}catch(e){toast(e.message)}}})}
function editPart(p={}){modal(p.id?'Edit part':'Add a new part','<form id="partform"><div class="adminfields">'+[['name','Part name','text'],['part_number','OEM / part number','text'],['brand','Vehicle brand','text'],['model','Vehicle model','text'],['price','Price (INR)','number'],['stock','Quantity','number'],['condition','Condition / inspection','text'],['image_url','Photo URL (HTTPS)','url']].map(([id,label,type])=>'<label>'+label+'<input id="p_'+id+'" type="'+type+'" '+(['name','brand','model','price','stock','condition'].includes(id)?'required':'')+' '+(type==='number'?'min="0" step="'+(id==='stock'?'1':'0.01')+'"':'')+' value="'+esc(p[id]??(id==='stock'?1:''))+'"></label>').join('')+'<label>Category<select id="p_category">'+CATS.map(([id,n])=>'<option value="'+id+'" '+(p.category===id?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Offer<select id="p_offer"><option value="false">No</option><option value="true" '+(p.offer?'selected':'')+'>Yes</option></select></label><label style="grid-column:1/-1">Description / donor / fitment notes<textarea id="p_description" rows="4">'+esc(p.description||'')+'</textarea></label></div><button class="primary wide">Save to live inventory</button><button class="textbtn" type="button" id="cancelpart">Cancel</button><p class="note" id="savestatus"></p></form>');$('cancelpart').onclick=adminPanel;$('partform').onsubmit=async e=>{e.preventDefault();let data={};for(let k of ['name','part_number','brand','model','condition','image_url','category','description'])data[k]=$('p_'+k).value.trim();data.price=Number($('p_price').value);data.stock=Number($('p_stock').value);data.offer=$('p_offer').value==='true';if(!Number.isInteger(data.stock)||data.stock<0){$('savestatus').textContent='Quantity must be a whole number.';return}if(data.image_url&&!data.image_url.startsWith('https://')){$('savestatus').textContent='Use an HTTPS photo URL.';return}$('savestatus').textContent='Saving...';try{await api('/rest/v1/parts'+(p.id?'?id=eq.'+encodeURIComponent(p.id):''),p.id?'PATCH':'POST',data,session.access_token);await loadStock();adminPanel();toast('Saved to shared inventory')}catch(e){$('savestatus').textContent=e.message}}}
let products=[],session=null;try{session=JSON.parse(sessionStorage.getItem('av-session')||'null')}catch{}
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function modal(title,body){$('modaltitle').textContent=title;$('modalbody').innerHTML=body;}
function closeModal(){openAdmin()}
async function loadStock(){products=await api('/rest/v1/parts?select=*&order=created_at.desc')}
openAdmin();loadStock().then(()=>{if(session)adminPanel()}).catch(e=>toast(e.message));
</script></body></html>
