async function api(path,method='GET',body,token){let r=await fetch(CONFIG.url+path,{method,headers:{apikey:CONFIG.key,Authorization:'Bearer '+(token||CONFIG.key),'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):undefined});let text=await r.text(),data;try{data=JSON.parse(text)}catch{data=text}if(r.status===401&&token&&session?.refresh_token&&!path.startsWith('/auth/')){session=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});sessionStorage.setItem('av-session',JSON.stringify(session));return api(path,method,body,session.access_token)}if(!r.ok)throw Error(data.message||data.msg||data.error_description||'Request failed ('+r.status+')');return data}

function adminPanel(){modal('Manage inventory','<p class="note">Changes are saved to the shared backend, not just this browser. Only your authorized account can write.</p><button class="primary" id="newpart">+ Add new part</button><button class="textbtn" id="logout">Sign out</button><div class="stats"><div><b>'+products.length+'</b>Live listings</div><div><b>'+products.reduce((n,p)=>n+p.stock,0)+'</b>Total quantity</div></div><div id="adminlist"></div>');$('logout').onclick=()=>{session=null;sessionStorage.removeItem('av-session');openAdmin();toast('Signed out')};$('newpart').onclick=()=>editPart();let live=products.filter(p=>!p.id.startsWith('demo'));$('adminlist').innerHTML=live.length?live.map(p=>'<div class="cartrow"><div style="flex:1"><h3>'+esc(p.name)+'</h3><span class="note">'+esc(p.brand)+' '+esc(p.model)+' · '+money(p.price)+' · Stock '+p.stock+'</span></div><button class="textbtn" data-edit="'+p.id+'">Edit</button><button class="textbtn" data-delete="'+p.id+'">Delete</button></div>').join(''):'<p class="empty">No real parts yet. Add your first listing.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPart(products.find(p=>p.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let p=products.find(p=>p.id===b.dataset.delete);modal('Delete listing?','<p class="note">Remove '+esc(p.name)+' from the shared catalog? This cannot be undone here.</p><button class="primary" id="confirmdelete">Delete listing</button><button class="textbtn" id="canceldelete">Cancel</button>');$('canceldelete').onclick=adminPanel;$('confirmdelete').onclick=async()=>{try{await api('/rest/v1/parts?id=eq.'+encodeURIComponent(p.id),'DELETE',null,session.access_token);const photoPath=storedPhotoPath(p.image_url);if(photoPath)await removePartPhoto(photoPath).catch(()=>toast('Listing removed. Delete its unused photo in Storage.'));await loadStock();adminPanel();toast('Listing deleted')}catch(e){toast(e.message)}}})}
function editPart(p={}){modal(p.id?'Edit part':'Add a new part','<form id="partform"><div class="adminfields">'+[['name','Part name','text'],['part_number','OEM / part number','text'],['brand','Vehicle brand','text'],['model','Vehicle model','text'],['price','Price (INR)','number'],['stock','Quantity','number'],['condition','Condition / inspection','text'],['image_url','Optional photo URL fallback (HTTPS)','url']].map(([id,label,type])=>'<label>'+label+'<input id="p_'+id+'" type="'+type+'" '+(['name','brand','model','price','stock','condition'].includes(id)?'required':'')+' '+(type==='number'?'min="0" step="'+(id==='stock'?'1':'0.01')+'"':'')+' value="'+esc(p[id]??(id==='stock'?1:''))+'"></label>').join('')+'<label style="grid-column:1/-1">Upload original part photo<input id="p_photo" type="file" accept="image/jpeg,image/png,image/webp"><button type="button" class="textbtn" id="previewphoto">Preview selected photo</button><small>JPG, PNG or WebP, up to 5 MB. Photos are public on your customer listing. Use a photo you own or have permission to publish. No customer documents.</small><img id="p_preview" alt="Selected part photo preview" style="display:none;max-width:180px;max-height:130px;margin-top:10px;border-radius:10px"></label><label>Category<select id="p_category">'+CATS.map(([id,n])=>'<option value="'+id+'" '+(p.category===id?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Offer<select id="p_offer"><option value="false">No</option><option value="true" '+(p.offer?'selected':'')+'>Yes</option></select></label><label style="grid-column:1/-1">Description / donor / fitment notes<textarea id="p_description" rows="4">'+esc(p.description||'')+'</textarea></label></div><button class="primary wide">Save to live inventory</button><button class="textbtn" type="button" id="cancelpart">Cancel</button><p class="note" id="savestatus"></p></form>');$('cancelpart').onclick=adminPanel;const showPreview=()=>{const f=$('p_photo').files[0];if(!f)return;const img=$('p_preview');const reader=new FileReader();reader.onload=()=>{img.src=reader.result;img.style.display='block'};reader.readAsDataURL(f)};$('p_photo').onchange=showPreview;$('previewphoto').onclick=showPreview;$('partform').onsubmit=async e=>{e.preventDefault();let data={};for(let k of ['name','part_number','brand','model','condition','image_url','category','description'])data[k]=$('p_'+k).value.trim();data.price=Number($('p_price').value);data.stock=Number($('p_stock').value);data.offer=$('p_offer').value==='true';if(!Number.isInteger(data.stock)||data.stock<0){$('savestatus').textContent='Quantity must be a whole number.';return}if(data.image_url&&!data.image_url.startsWith('https://')){$('savestatus').textContent='Use an HTTPS photo URL.';return}const photo=$('p_photo').files[0];if(photo&&(!['image/jpeg','image/png','image/webp'].includes(photo.type)||photo.size>5*1024*1024)){$('savestatus').textContent='Choose JPG, PNG or WebP up to 5 MB.';return}const save=$('partform').querySelector('button[type=submit]')||$('partform').querySelector('button.primary');save.disabled=true;$('savestatus').textContent=photo?'Uploading photo...':'Saving...';let uploadedPath=null;try{if(photo){const result=await uploadPartPhoto(photo);data.image_url=result.url;uploadedPath=result.path;$('savestatus').textContent='Photo uploaded. Saving listing...'}await api('/rest/v1/parts'+(p.id?'?id=eq.'+encodeURIComponent(p.id):''),p.id?'PATCH':'POST',data,session.access_token);await loadStock();adminPanel();toast('Saved to shared inventory')}catch(e){if(uploadedPath)await removePartPhoto(uploadedPath).catch(()=>{});$('savestatus').textContent=e.message;save.disabled=false}}}
let products=[],session=null;try{session=JSON.parse(sessionStorage.getItem('av-session')||'null')}catch{}
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function modal(title,body){$('modaltitle').textContent=title;$('modalbody').innerHTML=body;if(title==='Add a new part'||title==='Edit part')prepareSuggestions();}
function closeModal(){openAdmin()}
async function loadStock(){products=await api('/rest/v1/parts?select=*&order=created_at.desc')}

function prepareSuggestions(){
 $('p_brand').setAttribute('list','brandhints');$('p_model').setAttribute('list','modelhints');
 $('partform').insertAdjacentHTML('beforeend','<datalist id="brandhints">'+Object.keys(VEHICLE_HINTS).map(b=>'<option value="'+esc(b)+'">').join('')+'</datalist><datalist id="modelhints"></datalist><div class="hintcard" id="suggestions"><strong>Listing checklist</strong><br>Enter a part name for category guidance. Add original photos, donor year, engine/variant, OEM number and inspection notes. Suggestions never certify fitment.</div>');
 const update=()=>{let b=$('p_brand').value;$('modelhints').innerHTML=(VEHICLE_HINTS[b]?.models||[]).map(m=>'<option value="'+esc(m)+'">').join('');let n=$('p_name').value.toLowerCase(),cat=null,guide='';for(let [word,c] of [['brake','Brakes'],['disc','Brakes'],['alternator','Electrical'],['battery','Electrical'],['headlamp','Body'],['bumper','Body'],['wheel','Wheels'],['tyre','Wheels'],['shock','Suspension'],['strut','Suspension'],['engine','Engine'],['radiator','Engine']])if(n.includes(word)){cat=c;break}if(cat)guide='<strong>Suggested category: '+esc(cat)+'</strong><br><button type="button" class="textbtn" id="applycategory">Use this category</button><br>';
 $('suggestions').innerHTML=guide+'Required before real sale: donor year/variant, OEM part number, actual condition, inspection, original photo and quantity. Set your own price; no market-price estimate is available. Brand/model suggestions come from the broad catalog, not verified fitment.';
 if($('applycategory'))$('applycategory').onclick=()=>{$('p_category').value=cat;toast('Category selected. Review before saving.')};};
 $('p_name').addEventListener('input',update);$('p_brand').addEventListener('input',update);update();
}


async function uploadPartPhoto(file){if(!session)throw Error('Sign in again before uploading.');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];const path=session.user.id+'/'+crypto.randomUUID()+'.'+ext;const send=()=>fetch(CONFIG.url+'/storage/v1/object/part-photos/'+path,{method:'POST',headers:{apikey:CONFIG.key,Authorization:'Bearer '+session.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});let r=await send();if(r.status===401&&session.refresh_token){session=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});sessionStorage.setItem('av-session',JSON.stringify(session));r=await send()}if(!r.ok)throw Error('Photo upload failed ('+r.status+'). Try a smaller JPG, PNG or WebP.');return {path,url:CONFIG.url+'/storage/v1/object/public/part-photos/'+path}}
function storedPhotoPath(url){const prefix=CONFIG.url+'/storage/v1/object/public/part-photos/';return url?.startsWith(prefix)?url.slice(prefix.length):null}
async function removePartPhoto(path){await api('/storage/v1/object/part-photos','DELETE',{prefixes:[path]},session.access_token)}
openAdmin();loadStock().then(()=>{if(session)adminPanel()}).catch(e=>toast(e.message));
</script></body></html>
